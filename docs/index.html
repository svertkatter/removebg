<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像処理ツール - Image Tools</title>
    <meta http-equiv="refresh" content="0; url=./remove/">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .tools-list {
            list-style: none;
            margin: 30px 0;
        }

        .tools-list li {
            margin: 15px 0;
        }

        .tools-list a {
            display: block;
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tools-list a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ 画像処理ツール</h1>
        <div class="spinner"></div>
        <p>背景削除ページにリダイレクト中...</p>
        <p style="font-size: 0.9em; color: #999;">自動的にリダイレクトされない場合は、以下をクリックしてください:</p>
        <ul class="tools-list">
            <li><a href="./remove/">🎨 背景削除ツール</a></li>
        </ul>
    </div>

    <script>
        // JavaScriptでもリダイレクト（metaタグが効かない場合のため）
        setTimeout(() => {
            window.location.href = './remove/';
        }, 100);
    </script>
</body>
</html>
