<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像背景削除アプリ - Background Remover</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .file-label {
            display: block;
            padding: 40px 20px;
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-label:hover {
            background: #e9ecef;
            border-color: #764ba2;
            transform: translateY(-2px);
        }

        .file-label span {
            color: #667eea;
            font-weight: 600;
            font-size: 1.1em;
        }

        .preview-container {
            display: none;
            margin: 30px 0;
        }

        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .image-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .image-box h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .image-box img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-process {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-process:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-process:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-download {
            background: #28a745;
            color: white;
            display: none;
        }

        .btn-download:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }

        .btn-reset {
            background: #6c757d;
            color: white;
        }

        .btn-reset:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(108, 117, 125, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #667eea;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #c33;
            margin: 20px 0;
            display: none;
        }

        .info {
            background: #e7f3ff;
            color: #004085;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #004085;
            margin: 20px 0;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .image-grid {
                grid-template-columns: 1fr;
            }
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: #999;
            font-size: 0.85em;
        }

        footer a {
            color: #667eea;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ 画像背景削除アプリ</h1>
        <p class="subtitle">画像をアップロードすると背景を自動的に削除します（完全ブラウザ内処理）</p>

        <div class="info">
            💡 このアプリは完全にブラウザ内で動作します。画像はサーバーにアップロードされず、プライバシーが保護されます。初回実行時、AIモデル（約30MB）のダウンロードに時間がかかる場合があります。
        </div>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/gif,image/bmp,image/webp">
                <label for="fileInput" class="file-label">
                    <span id="fileName">📁 画像ファイルを選択またはドラッグ&ドロップ</span>
                </label>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p class="loading-text">処理中...</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div id="error" class="error"></div>

        <div id="previewContainer" class="preview-container">
            <div class="image-grid">
                <div class="image-box">
                    <h3>元の画像</h3>
                    <img id="originalImage" src="" alt="元の画像">
                </div>
                <div class="image-box">
                    <h3>背景削除後</h3>
                    <img id="processedImage" src="" alt="処理済み画像">
                </div>
            </div>

            <button id="downloadBtn" class="btn btn-download">ダウンロード</button>
            <button id="resetBtn" class="btn btn-reset">別の画像を処理</button>
        </div>

        <footer>
            <p>Powered by <a href="https://github.com/imgly/background-removal-js" target="_blank">@imgly/background-removal</a></p>
        </footer>
    </div>

    <script type="module">
        import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm';

        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const previewContainer = document.getElementById('previewContainer');
        const originalImage = document.getElementById('originalImage');
        const processedImage = document.getElementById('processedImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressFill = document.getElementById('progressFill');

        let processedBlob = null;

        // ファイル選択時の処理
        fileInput.addEventListener('change', handleFileSelect);

        // ドラッグ&ドロップ対応
        const fileLabel = document.querySelector('.file-label');

        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#764ba2';
            fileLabel.style.background = '#e9ecef';
        });

        fileLabel.addEventListener('dragleave', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#667eea';
            fileLabel.style.background = '#f8f9fa';
        });

        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#667eea';
            fileLabel.style.background = '#f8f9fa';

            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        async function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            // ファイルタイプチェック
            if (!file.type.startsWith('image/')) {
                showError('画像ファイルを選択してください');
                return;
            }

            fileName.textContent = file.name;
            hideError();
            previewContainer.style.display = 'none';

            // 元画像を表示
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);

            // 背景削除処理を開始
            await removeBackground(file);
        }

        async function removeBackground(file) {
            loading.style.display = 'block';
            downloadBtn.style.display = 'none';
            progressFill.style.width = '0%';

            try {
                // プログレス更新のシミュレーション
                let progress = 0;
                const progressInterval = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress > 90) progress = 90;
                    progressFill.style.width = progress + '%';
                }, 300);

                // 背景削除実行
                const blob = await imglyRemoveBackground(file);
                processedBlob = blob;

                // プログレス完了
                clearInterval(progressInterval);
                progressFill.style.width = '100%';

                // 結果を表示
                const url = URL.createObjectURL(blob);
                processedImage.src = url;

                loading.style.display = 'none';
                previewContainer.style.display = 'block';
                downloadBtn.style.display = 'block';

            } catch (err) {
                loading.style.display = 'none';
                showError('処理中にエラーが発生しました: ' + err.message);
                console.error(err);
            }
        }

        // ダウンロードボタン
        downloadBtn.addEventListener('click', () => {
            if (!processedBlob) return;

            const url = URL.createObjectURL(processedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'background_removed.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // リセットボタン
        resetBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileName.textContent = '📁 画像ファイルを選択またはドラッグ&ドロップ';
            previewContainer.style.display = 'none';
            hideError();
            processedBlob = null;
        });

        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }

        function hideError() {
            error.style.display = 'none';
        }
    </script>
</body>
</html>
